services:
  api:
    image: ${ECR_REGISTRY}/recordshop-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: recordshop/prod
      AWS_REGION: eu-west-1
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  worker:
    image: ${ECR_REGISTRY}/recordshop-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: recordshop/prod
      AWS_REGION: eu-west-1
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_started

  beat:
    image: ${ECR_REGISTRY}/recordshop-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: recordshop/prod
      AWS_REGION: eu-west-1
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_started

  web:
    image: ${ECR_REGISTRY}/recordshop-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_DEV_ADMIN_BYPASS: ${NEXT_PUBLIC_DEV_ADMIN_BYPASS:-false}
      NEXT_PUBLIC_FARO_COLLECTOR_URL: ${NEXT_PUBLIC_FARO_COLLECTOR_URL:-}
    depends_on:
      - api
    expose:
      - "3000"

  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    env_file: .env.grafana
    volumes:
      - ./infra/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
    command: run --server.http.listen-addr=127.0.0.1:12345 /etc/alloy/config.alloy
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/srv/uploads:ro
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
  uploads:
