services:
  api:
    image: ${ECR_REGISTRY}/nukaesaas-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: nukaesaas/prod
      AWS_SUPERADMIN_SECRETS_NAME: nukaesaas/superadmin
      AWS_REGION: eu-west-1
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  worker:
    image: ${ECR_REGISTRY}/nukaesaas-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: nukaesaas/prod
      AWS_SUPERADMIN_SECRETS_NAME: nukaesaas/superadmin
      AWS_REGION: eu-west-1
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_started

  beat:
    image: ${ECR_REGISTRY}/nukaesaas-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: nukaesaas/prod
      AWS_SUPERADMIN_SECRETS_NAME: nukaesaas/superadmin
      AWS_REGION: eu-west-1
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_started

  web:
    image: ${ECR_REGISTRY}/nukaesaas-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_DEV_ADMIN_BYPASS: ${NEXT_PUBLIC_DEV_ADMIN_BYPASS:-false}
      NEXT_PUBLIC_FARO_COLLECTOR_URL: ${NEXT_PUBLIC_FARO_COLLECTOR_URL:-}
      NEXT_PUBLIC_SUPERADMIN_HOST: ${NEXT_PUBLIC_SUPERADMIN_HOST:-superadmin.localhost}
      NEXT_PUBLIC_APP_HOST: ${NEXT_PUBLIC_APP_HOST:-localhost}
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      SUPERADMIN_HOST: ${SUPERADMIN_HOST:-superadmin.localhost}
      NEXT_PUBLIC_APP_HOST: ${NEXT_PUBLIC_APP_HOST:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads:/srv/uploads:ro
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
  uploads:
