services:
  api:
    image: ${ECR_REGISTRY}/nukaesaas-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: nukaesaas/prod
      AWS_SUPERADMIN_SECRETS_NAME: nukaesaas/superadmin
      AWS_REGION: eu-west-1
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Subidas del admin: `s3` en producción (bucket de terraform-uploads); `local` escribe
      # en el volumen de abajo (vuelta atrás / desarrollo). Ver api/app/services/storage.py.
      UPLOADS_BACKEND: ${UPLOADS_BACKEND:-local}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET:-}
    expose:
      - "8000"
    volumes:
      # Con UPLOADS_BACKEND=s3 ya no se escribe aquí; se conserva como copia de seguridad
      # de la migración (borrar el volumen cuando se dé por buena).
      - uploads:/app/uploads

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  worker:
    image: ${ECR_REGISTRY}/nukaesaas-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: nukaesaas/prod
      AWS_SUPERADMIN_SECRETS_NAME: nukaesaas/superadmin
      AWS_REGION: eu-west-1
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_started

  beat:
    image: ${ECR_REGISTRY}/nukaesaas-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AWS_SECRETS_NAME: nukaesaas/prod
      AWS_SUPERADMIN_SECRETS_NAME: nukaesaas/superadmin
      AWS_REGION: eu-west-1
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_started

  web:
    image: ${ECR_REGISTRY}/nukaesaas-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_DEV_ADMIN_BYPASS: ${NEXT_PUBLIC_DEV_ADMIN_BYPASS:-false}
      NEXT_PUBLIC_FARO_COLLECTOR_URL: ${NEXT_PUBLIC_FARO_COLLECTOR_URL:-}
      NEXT_PUBLIC_SUPERADMIN_HOST: ${NEXT_PUBLIC_SUPERADMIN_HOST:-superadmin.localhost}
      NEXT_PUBLIC_APP_HOST: ${NEXT_PUBLIC_APP_HOST:-localhost}
    depends_on:
      - api
    expose:
      - "3000"

  # Envia logs dels contenidors, mètriques de l'api (/metrics) i del host a
  # Grafana Cloud (stack punycrane5). Mateixa config que docker-compose.prod.yml
  # (l'EC2 antic de recordshop, ja aturat). GRAFANA_API_KEY arriba via
  # .env.grafana, que escriu scripts/deploy_nukaesaas.sh (mode 600).
  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    env_file: .env.grafana
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /:/rootfs:ro
    command: run --server.http.listen-addr=127.0.0.1:12345 /etc/alloy/config.alloy
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - api
      - dockerproxy

  dockerproxy:
    # Solo lectura de contenedores/redes para Alloy; sin esto Alloy montaba
    # el socket de Docker entero (equivalente a root en el host).
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      SUPERADMIN_HOST: ${SUPERADMIN_HOST:-superadmin.localhost}
      NEXT_PUBLIC_APP_HOST: ${NEXT_PUBLIC_APP_HOST:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      # Dominio de CloudFront que sirve /uploads/* (terraform-uploads, output cdn_domain). El valor
      # por defecto es inválido a propósito: Caddy arranca igualmente y /uploads responde 502.
      UPLOADS_CDN_HOST: ${UPLOADS_CDN_HOST:-uploads-no-configurado.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
  uploads:
